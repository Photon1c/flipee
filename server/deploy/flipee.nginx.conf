# Flipee relay — nginx site.
#
#   sudo cp server/deploy/flipee.nginx.conf /etc/nginx/sites-available/flipee
#   sudo ln -s /etc/nginx/sites-available/flipee /etc/nginx/sites-enabled/flipee
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check `nginx -t` before reloading. A server block that references a
# certificate file which doesn't exist takes the *whole* config down, not
# just its own site — which is how this host ended up answering 500 on
# every path, including ones the Flask app never returns 500 for.
#
# There is no TLS block here on purpose. The only route to this host is
# the tailnet, WireGuard already encrypts that hop, and no CA will issue
# a certificate for a 100.x address. When Flipee gets a public domain,
# add a 443 block with a real certbot cert and set RELAY_USE_TLS = true
# in the sketch. On a tailnet specifically, `tailscale cert
# <node>.<tailnet>.ts.net` issues a genuine Let's Encrypt cert for the
# MagicDNS name — that needs the hostname, not the IP.

server {
    listen 80;
    listen [::]:80;
    server_name srv1313560 100.70.36.88 _;

    # Tailnet-only, enforced here rather than by binding the tailscale
    # address directly: `listen 100.70.36.88:80` fails outright if nginx
    # starts before tailscaled has brought the interface up, which on a
    # reboot means no relay at all. An allow/deny list can't lose that
    # race. 100.64.0.0/10 is the CGNAT range Tailscale assigns from.
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    # Reflection payloads are a city, an SSID and eight headlines. Nothing
    # legitimate here is large.
    client_max_body_size 64k;

    access_log /var/log/nginx/flipee.access.log;
    error_log  /var/log/nginx/flipee.error.log;

    location / {
        proxy_pass http://127.0.0.1:5024;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Deliberately $remote_addr and NOT $proxy_add_x_forwarded_for.
        # The relay throttles failed dashboard logins per client IP and
        # trusts the first value in this header; appending would let a
        # client supply its own first value, pick a fresh identity on
        # every attempt, and never hit the lockout.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /reflect blocks on an LLM round trip — measured 5-7s. The device
        # gives up after RELAY_TIMEOUT_MS (15s) and writes a templated
        # reflection instead, so a longer timeout here only holds a worker
        # open for an answer nobody is still waiting for.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
